name: Shared Test Runner

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite to run
        required: false
        default: all
        type: string
      project:
        description: Browser project to run
        required: false
        default: chromium
        type: string
      grep:
        description: Optional grep expression
        required: false
        default: ""
        type: string
      workflow-name:
        description: Display name used in logs and notifications
        required: false
        default: QA Tests
        type: string
      node-version:
        description: Node.js version for the runner
        required: false
        default: "24"
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 60
        type: number
      upload-allure:
        description: Generate and upload Allure artifacts
        required: false
        default: false
        type: boolean
      upload-qase:
        description: Upload results to Qase TestOps
        required: false
        default: false
        type: boolean
      upload-console-results:
        description: Upload console output artifact
        required: false
        default: true
        type: boolean
      publish-pages-report:
        description: Publish the generated HTML report to GitHub Pages
        required: false
        default: false
        type: boolean
      pages-report-path:
        description: Directory with the HTML report that should be published
        required: false
        default: playwright-report
        type: string
      pages-report-name:
        description: Human readable name of the published report
        required: false
        default: Playwright report
        type: string
      notify-slack:
        description: Send Slack notification when credentials are configured
        required: false
        default: false
        type: boolean
      stop-containers:
        description: Stop docker compose services at the end of the run
        required: false
        default: true
        type: boolean

jobs:
  validate:
    name: Validate test project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Validate TypeScript and formatting
        run: npm run validate

  prepare_qase:
    name: Prepare Qase Run
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.qase.outputs.enabled }}
      run-id: ${{ steps.qase.outputs.run-id }}
      run-url: ${{ steps.qase.outputs.run-url }}
    steps:
      - name: Create shared Qase run
        id: qase
        continue-on-error: true
        env:
          QASE_ENABLED: ${{ inputs.upload-qase && secrets.QASE_API_TOKEN != '' }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT: ZEN
          QASE_RUN_TITLE: "CI run #${{ github.run_number }} — ${{ github.head_ref || github.ref_name }} (${{ inputs.suite }}/${{ inputs.project }})"
        shell: bash
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"

          if [ "$QASE_ENABLED" != "true" ]; then
            echo "Qase reporting is disabled"
            exit 0
          fi

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.qase.io/v1/run/${QASE_PROJECT}" \
            -H "Token: ${QASE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg title "$QASE_RUN_TITLE" '{title: $title, is_autotest: true, cases: []}')")
          RUN_ID=$(jq -er '.result.id' <<< "$RESPONSE")

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run-url=https://app.qase.io/run/${QASE_PROJECT}/dashboard/${RUN_ID}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ inputs.workflow-name }} (shard ${{ matrix.shard }}/2)
    needs: prepare_qase
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    env:
      CI: "true"
      BASE_URL: "http://juice-shop:3000"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      QASE_MODE: ${{ needs.prepare_qase.outputs.enabled == 'true' && 'testops' || 'off' }}
      QASE_TESTOPS_PROJECT: "ZEN"
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      QASE_TESTOPS_RUN_ID: ${{ needs.prepare_qase.outputs.run-id }}
      QASE_TESTOPS_RUN_TITLE: "CI run #${{ github.run_number }} — ${{ github.head_ref || github.ref_name }} (${{ inputs.suite }}/${{ inputs.project }})"
      QASE_TESTOPS_RUN_COMPLETE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Wait for Juice Shop
        run: |
          timeout 90s bash -c 'until curl -sf http://juice-shop:3000 > /dev/null; do sleep 5; done'

      - name: Run selected tests
        id: run_tests
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
        run: |
          # Playwright returns 1 when assertions expose product defects. Capture
          # that expected signal without making GitHub annotate this technical
          # execution step as failed; the next step classifies the result.
          set -o pipefail

          if [ "$QASE_MODE" = "testops" ] && [ -n "$QASE_TESTOPS_API_TOKEN" ]; then
            echo "Qase reporting enabled"
          fi

          CMD=(npx playwright test)

          case "$SUITE" in
            ui) CMD+=(tests/ui) ;;
            api) CMD+=(tests/api) ;;
            security) CMD+=(tests/security) ;;
            smoke) CMD+=(--grep @smoke) ;;
            auth) CMD+=(--grep @auth) ;;
            search) CMD+=(--grep @search) ;;
            basket) CMD+=(--grep @basket) ;;
            all) ;;
            *) echo "::error::Unknown suite: $SUITE"; exit 1 ;;
          esac

          if [ "$PROJECT" != "all" ]; then
            case "$PROJECT" in
              chromium|firefox|webkit) CMD+=(--project="$PROJECT") ;;
              *) echo "::error::Unknown project: $PROJECT"; exit 1 ;;
            esac
          fi

          if [ -n "$GREP" ]; then
            CMD+=(--grep "$GREP")
          fi

          CMD+=(--shard=${{ matrix.shard }}/2 --pass-with-no-tests)

          printf 'Running command:'
          printf ' %q' "${CMD[@]}"
          echo

          set +e
          "${CMD[@]}" | tee test-results.txt
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          set -e

          PLAYWRIGHT_EXIT_CODE=${PIPE_STATUSES[0]}
          if [ "${PIPE_STATUSES[1]}" -ne 0 ]; then
            echo "::error::Could not capture Playwright console output."
            exit 1
          fi

          echo "exit-code=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Collect test summary
        if: always()
        id: test_summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          let stats = {};
          if (fs.existsSync("test-report.json")) {
            try {
              stats = JSON.parse(fs.readFileSync("test-report.json", "utf8")).stats ?? {};
            } catch (error) {
              console.warn(`Could not parse test-report.json: ${error.message}`);
            }
          } else {
            console.warn("test-report.json is unavailable; reporting zero test counts");
          }

          const counts = {
            passed: stats.expected ?? 0,
            failed: stats.unexpected ?? 0,
            skipped: stats.skipped ?? 0,
            flaky: stats.flaky ?? 0,
          };

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(counts).map(([key, value]) => `${key}=${value}`).join("\n") + "\n",
          );
          NODE

      - name: Determine real failure vs found bug
        if: always()
        id: evaluate_run
        shell: bash
        run: |
          TOTAL=$(( ${{ steps.test_summary.outputs.passed }} + ${{ steps.test_summary.outputs.failed }} + ${{ steps.test_summary.outputs.skipped }} + ${{ steps.test_summary.outputs.flaky }} ))
          RUN_OUTCOME="${{ steps.run_tests.outcome }}"
          PLAYWRIGHT_EXIT_CODE="${{ steps.run_tests.outputs.exit-code }}"

          case "$PLAYWRIGHT_EXIT_CODE" in
            ''|*[!0-9]*)
              # A missing/invalid exit code means the runner did not reach the
              # end of the Playwright command and is therefore an infra issue.
              PLAYWRIGHT_EXIT_CODE=1
              ;;
          esac

          # Treat anything other than a clean success as a non-passing run,
          # not just "failure" — if an earlier required step (e.g. "Wait for
          # Juice Shop") already failed, run_tests never executes and its
          # outcome is "skipped", which must still be classified as an infra
          # failure rather than silently falling through to all_passed.
          if { [ "$RUN_OUTCOME" != "success" ] || [ "$PLAYWRIGHT_EXIT_CODE" -ne 0 ]; } && [ "$TOTAL" -eq 0 ]; then
            echo "::error::Playwright failed to run any tests at all — this looks like an infrastructure/config break, not a found bug."
            echo "status=infra_failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$PLAYWRIGHT_EXIT_CODE" -ne 0 ] || [ "${{ steps.test_summary.outputs.failed }}" -gt 0 ]; then
            {
              echo "### Product defects found"
              echo
              echo "Playwright completed normally and found ${{ steps.test_summary.outputs.failed }} failed assertion(s)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Some tests failed on real assertions (${{ steps.test_summary.outputs.failed }} failed) — tests ran as expected and found a bug in the product."
            echo "status=bugs_found" >> "$GITHUB_OUTPUT"
          else
            echo "status=all_passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Show report folders
        if: always()
        run: |
          echo "==== root ===="
          ls -la || true
          echo "==== playwright-report ===="
          ls -la playwright-report || true
          echo "==== allure-results ===="
          ls -la allure-results || true
          echo "==== allure-report ===="
          ls -la allure-report || true

      - name: Upload console test results
        if: ${{ always() && inputs.upload-console-results }}
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: test-results-shard-${{ matrix.shard }}
          path: test-results.txt
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 30

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: json-report-shard-${{ matrix.shard }}
          path: test-report.json
          retention-days: 30

      - name: Upload Allure results
        if: ${{ always() && inputs.upload-allure }}
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results/
          retention-days: 30

  complete_qase:
    name: Complete Qase Run
    if: ${{ always() && needs.prepare_qase.outputs.enabled == 'true' }}
    needs:
      - prepare_qase
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Complete shared Qase run
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT: ZEN
          QASE_RUN_ID: ${{ needs.prepare_qase.outputs.run-id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.qase.io/v1/run/${QASE_PROJECT}/${QASE_RUN_ID}/complete" \
            -H "Token: ${QASE_API_TOKEN}"

  aggregate:
    name: Merge Shard Reports
    if: always()
    needs:
      - prepare_qase
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      flaky: ${{ steps.summary.outputs.flaky }}
      run-status: ${{ steps.summary.outputs.run-status }}
      playwright-artifact-url: ${{ steps.playwright_report.outputs.artifact-url }}
      allure-artifact-url: ${{ steps.allure_report.outputs.artifact-url }}
      analysis-message: ${{ steps.analyze.outputs.analysis-message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Download blob reports
        id: download_blobs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        id: merge_reports
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-report.json
        run: npx playwright merge-reports --reporter=html,json all-blob-reports

      - name: Download Allure results
        if: ${{ inputs.upload-allure }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-shard-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure report
        if: ${{ inputs.upload-allure }}
        run: |
          apt-get update -qq && apt-get install -y -qq default-jre-headless > /dev/null
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate allure-results --clean -o allure-report
          fi

      - name: Collect merged test summary
        if: always()
        id: summary
        env:
          SHARD_JOB_RESULT: ${{ needs.test.result }}
          MERGE_RESULT: ${{ steps.merge_reports.outcome }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          let stats = {};
          if (fs.existsSync("test-report.json")) {
            try {
              stats = JSON.parse(fs.readFileSync("test-report.json", "utf8")).stats ?? {};
            } catch (error) {
              console.warn(`Could not parse merged test-report.json: ${error.message}`);
            }
          }
          const counts = {
            passed: stats.expected ?? 0,
            failed: stats.unexpected ?? 0,
            skipped: stats.skipped ?? 0,
            flaky: stats.flaky ?? 0,
          };
          const total = Object.values(counts).reduce((sum, value) => sum + value, 0);
          const status = process.env.SHARD_JOB_RESULT !== "success" || process.env.MERGE_RESULT !== "success" || total === 0
            ? "infra_failure"
            : counts.failed > 0
              ? "bugs_found"
              : "all_passed";
          const output = { ...counts, "run-status": status };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(output).map(([key, value]) => `${key}=${value}`).join("\n") + "\n",
          );
          NODE

      - name: Upload Playwright report
        if: always()
        id: playwright_report
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure results
        if: ${{ always() && inputs.upload-allure }}
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure report
        if: ${{ always() && inputs.upload-allure }}
        id: allure_report
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Prepare published report
        if: ${{ always() && inputs.publish-pages-report }}
        env:
          REPORT_PATH: ${{ inputs.pages-report-path }}
          REPORT_NAME: ${{ inputs.pages-report-name }}
        run: |
          mkdir -p published-report
          if [ -d "$REPORT_PATH" ] && [ "$(ls -A "$REPORT_PATH" 2>/dev/null)" ]; then
            cp -R "$REPORT_PATH"/. published-report/
          elif [ -d "playwright-report" ]; then
            cp -R playwright-report/. published-report/
          fi
          if [ -d "playwright-report" ]; then
            mkdir -p published-report/playwright-report
            cp -R playwright-report/. published-report/playwright-report/
          fi
          if [ -d "allure-report" ]; then
            mkdir -p published-report/allure-report
            cp -R allure-report/. published-report/allure-report/
          fi

      - name: Upload Pages artifact
        if: ${{ always() && inputs.publish-pages-report }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: published-report

      - name: Attach report links to workflow summary
        if: always()
        run: |
          echo "[GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ needs.prepare_qase.outputs.run-url }}" ]; then
            echo "[Open Qase run](${{ needs.prepare_qase.outputs.run-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Analyze test results
        if: ${{ always() && inputs.notify-slack }}
        id: analyze
        run: |
          if [ -f test-report.json ]; then
            npx tsx src/agents/analyzer/analyzeResults.ts test-report.json analysis-message.txt
          else
            echo ":mag: *Test Analysis*" > analysis-message.txt
            echo "" >> analysis-message.txt
            echo "Merged test report is unavailable." >> analysis-message.txt
          fi
          npx tsx src/agents/coverage/collectCoverage.ts --slack "" coverage-message.txt
          {
            echo 'analysis-message<<EOF'
            cat analysis-message.txt
            echo ""
            cat coverage-message.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  deploy_report:
    name: Deploy Published Report
    if: ${{ always() && inputs.publish-pages-report && github.event_name != 'pull_request' }}
    needs: aggregate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add published report links to summary
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "[Open published ${{ inputs.pages-report-name }}](${PAGE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Playwright report](${PAGE_URL}playwright-report/)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload-allure }}" = "true" ]; then
            echo "[Open Allure report](${PAGE_URL}allure-report/)" >> "$GITHUB_STEP_SUMMARY"
          fi

  notify:
    name: Notify Slack
    if: ${{ always() && inputs.notify-slack }}
    needs:
      - aggregate
      - complete_qase
      - deploy_report
      - prepare_qase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DISPLAY_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Debug Slack configuration
        if: always()
        shell: bash
        run: |
          echo "notify-slack input: ${{ inputs.notify-slack }}"
          echo "github event: ${{ github.event_name }}"
          echo "github ref: ${{ github.ref }}"
          echo "github actor: ${{ github.actor }}"
          echo "deploy_report result: ${{ needs.deploy_report.result }}"
          echo "published report url: ${{ needs.deploy_report.outputs.page-url }}"

          if [ -n "${SLACK_CHANNEL_ID}" ]; then
            echo "SLACK_CHANNEL_ID is present"
          else
            echo "SLACK_CHANNEL_ID is missing or empty"
          fi

          if [ -n "${SLACK_BOT_TOKEN}" ]; then
            echo "SLACK_BOT_TOKEN is present"
          else
            echo "SLACK_BOT_TOKEN is missing or empty"
          fi

      - name: Explain Slack skip reason
        if: ${{ always() && (env.SLACK_CHANNEL_ID == '' || env.SLACK_BOT_TOKEN == '') }}
        shell: bash
        run: |
          if [ -z "${SLACK_CHANNEL_ID}" ]; then
            echo "Slack notification skipped because SLACK_CHANNEL_ID is unavailable"
          fi

          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "Slack notification skipped because SLACK_BOT_TOKEN is unavailable"
          fi

      - name: Generate Slack message
        if: ${{ always() && env.SLACK_CHANNEL_ID != '' && env.SLACK_BOT_TOKEN != '' }}
        id: slack_message
        env:
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        shell: bash
        run: |
          RUN_STATUS="${{ needs.aggregate.outputs.run-status }}"

          if [ "$RUN_STATUS" = "infra_failure" ] || [ -z "$RUN_STATUS" ]; then
            HEADER=":rotating_light: *${{ inputs.workflow-name }}* — CI IS BROKEN on \`${DISPLAY_REF}\` (tests failed to run)"
          elif [ "$RUN_STATUS" = "bugs_found" ]; then
            HEADER=":bug: *${{ inputs.workflow-name }}* finished for \`${DISPLAY_REF}\` — bugs found in the product"
          else
            HEADER=":white_check_mark: *${{ inputs.workflow-name }}* finished for \`${DISPLAY_REF}\` — all tests passed"
          fi

          {
            echo 'message<<EOF'
            echo "$HEADER"
            echo ""
            echo ":white_check_mark: Passed: ${{ needs.aggregate.outputs.passed }}"
            echo ":x: Failed: ${{ needs.aggregate.outputs.failed }}"
            echo ":white_circle: Skipped: ${{ needs.aggregate.outputs.skipped }}"
            echo ":large_blue_circle: Flaky: ${{ needs.aggregate.outputs.flaky }}"
            echo ""
            echo "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open GitHub Actions run>"
            PAGE_URL="${{ needs.deploy_report.outputs.page-url }}"
            if [ -z "$PAGE_URL" ] && [ "${{ inputs.publish-pages-report }}" = "true" ]; then
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
              PAGE_URL="https://${OWNER}.github.io/${REPO}/"
            fi
            if [ -n "$PAGE_URL" ]; then
              echo "<${PAGE_URL}playwright-report/|:bar_chart: Open Playwright report>"
              if [ "${{ inputs.upload-allure }}" = "true" ]; then
                echo "<${PAGE_URL}allure-report/|:bar_chart: Open Allure report>"
              fi
            fi
            if [ -n "${{ needs.prepare_qase.outputs.run-url }}" ]; then
              echo "<${{ needs.prepare_qase.outputs.run-url }}|:bar_chart: Open Qase run>"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify in Slack
        id: slack_notify
        if: ${{ always() && steps.slack_message.outputs.message != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SLACK_CHANNEL_ID }}",
              "text": ${{ toJSON(steps.slack_message.outputs.message) }}
            }

      - name: Post analysis as thread reply
        if: ${{ always() && steps.slack_notify.outputs.ts != '' && needs.aggregate.outputs.analysis-message != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        shell: bash
        run: |
          ANALYSIS_TEXT=$(cat <<'ANALYSIS_EOF'
          ${{ needs.aggregate.outputs.analysis-message }}
          ANALYSIS_EOF
          )

          PAYLOAD=$(jq -n \
            --arg channel "${{ vars.SLACK_CHANNEL_ID }}" \
            --arg thread_ts "${{ steps.slack_notify.outputs.ts }}" \
            --arg text "$ANALYSIS_TEXT" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text}')

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
